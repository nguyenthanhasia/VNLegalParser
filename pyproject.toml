[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-legal-parser"
version = "0.6.0"
description = "Robust rule-based parser for Vietnamese legal document structure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vietnamese Legal Parser contributors"}]
keywords = ["vietnamese", "legal", "law", "parser", "nlp", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Vietnamese",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
docx = ["python-docx>=1.1"]
all = ["pypdf>=5.0", "python-docx>=1.1"]
dev = ["pytest>=8.0", "build>=1.2", "ruff>=0.7"]


[project.urls]
Homepage = "https://github.com/nguyenthanhasia/VNLegalParser"
Repository = "https://github.com/nguyenthanhasia/VNLegalParser"
Demo = "https://huggingface.co/spaces/nguyenthanhasia/VNLegalParser"

[project.scripts]
vlp = "vietnamese_legal_parser.cli:main"

[tool.setuptools.packages.find]
include = ["vietnamese_legal_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
